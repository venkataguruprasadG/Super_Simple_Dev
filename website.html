<!-- 
This is a hyperlink (anchor tag) 
It is used to create a clickable link to another webpage
-->
<a href="https://www.youtube.com/" target="_blank">Link to Youtube</a>

<!-- 
  Attributes used in the <a> tag:

  href: This attribute holds the URL where the link will take the user.
        In this example, it points to https://www.youtube.com/
        
  target: This attribute controls where the linked page will open.
          "_blank" means the link will open in a new browser tab.
-->
